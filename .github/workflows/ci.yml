name: ci
on: [push,pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and start stack
        run: docker compose up -d --build
      - name: Wait for API
        run: |
          for i in {1..30}; do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          docker compose logs api db redis
          exit 1
      - name: Apply migrations
        run: |
          for migration in sql/migrations/*.sql; do
            docker compose exec -T db psql -U h3 -d h3project -v ON_ERROR_STOP=1 < "$migration"
          done
      - name: Seed API test dataset
        run: |
          curl -fsS -X POST             -H 'Content-Type: application/json'             --data-binary @data/ingest_test.json             'http://localhost:8000/ingestion/geojson/execute?resolution=11&dataset=api-test'
      - name: Backend tests
        run: docker compose exec -T api pytest -q tests
      - name: Frontend build
        run: docker compose build frontend
      - name: Shutdown
        if: always()
        run: docker compose down -v
