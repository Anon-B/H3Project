name: ci
on: [push,pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t h3project-api .
      - run: docker run --rm h3project-api python -m compileall app scripts benchmarks
      - run: docker run --rm h3project-api pytest -q tests
