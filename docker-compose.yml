services:
  db:
    build: {context: ., dockerfile: Dockerfile.db}
    container_name: h3project-db
    shm_size: 2gb
    command: ["postgres","-c","shared_buffers=${POSTGRES_SHARED_BUFFERS:-2GB}","-c","effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-6GB}","-c","work_mem=${POSTGRES_WORK_MEM:-16MB}","-c","maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-512MB}","-c","random_page_cost=1.1","-c","max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-h3project}
      POSTGRES_USER: ${POSTGRES_USER:-h3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-h3}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./backups:/app/backup, ./sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-h3} -d ${POSTGRES_DB:-h3project}"], interval: 5s, timeout: 5s, retries: 30}
  redis:
    image: redis:8-alpine
    container_name: h3project-redis
    command: ["redis-server","--maxmemory","1gb","--maxmemory-policy","allkeys-lru"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 5s, timeout: 3s, retries: 30}
  api:
    build: .
    container_name: h3project-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-h3}:${POSTGRES_PASSWORD:-h3}@db:5432/${POSTGRES_DB:-h3project}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      API_PORT: ${API_PORT:-8000}
      API_KEY: ${API_KEY:-}
      API_KEYS_JSON: ${API_KEYS_JSON:-}
      AUTH_MODE: ${AUTH_MODE:-optional}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
    volumes: [./data:/app/data, ./benchmarks:/app/benchmarks]
    command: ["sh","-c","rm -f /tmp/prometheus/* && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips=127.0.0.1,172.16.0.0/12"]
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: h3project-frontend
    ports: ["8080:80"]
    depends_on: [api]
    healthcheck: {test: ["CMD-SHELL","wget -qO- http://127.0.0.1/ >/dev/null || exit 1"], interval: 10s, timeout: 5s, retries: 30}
volumes:
  pgdata:
