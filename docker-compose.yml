services:
  db:
    build: {context: ., dockerfile: Dockerfile.db}
    container_name: h3project-db
    shm_size: 2gb
    command: ["postgres","-c","shared_buffers=4GB","-c","effective_cache_size=12GB","-c","work_mem=32MB","-c","maintenance_work_mem=1GB","-c","random_page_cost=1.1","-c","max_connections=200"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-h3project}
      POSTGRES_USER: ${POSTGRES_USER:-h3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-h3}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./backups:/app/backup]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-h3} -d ${POSTGRES_DB:-h3project}"], interval: 5s, timeout: 5s, retries: 30}
  redis:
    image: redis:8-alpine
    container_name: h3project-redis
    command: ["redis-server","--maxmemory","4gb","--maxmemory-policy","allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 5s, timeout: 3s, retries: 30}
  api:
    build: .
    container_name: h3project-api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://h3:h3@db:5432/h3project}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      API_PORT: ${API_PORT:-8000}
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
    volumes: [./data:/app/data, ./benchmarks:/app/benchmarks]
    command: ["uvicorn","app.main:app","--host","0.0.0.0","--port","8000","--workers","4"]
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: h3project-frontend
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  pgdata:
